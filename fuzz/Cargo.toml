[package]
name = "pinentry-omarchy-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
pinentry-omarchy = { path = ".." }

# Kept out of the main crate's build (and its cargo-deny graph).
[workspace]
members = ["."]

[[bin]]
name = "assuan_session"
path = "fuzz_targets/assuan_session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dialog_response"
path = "fuzz_targets/dialog_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_encoding"
path = "fuzz_targets/data_encoding.rs"
test = false
doc = false
bench = false
