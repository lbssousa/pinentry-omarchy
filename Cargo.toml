[package]
name = "pinentry-omarchy"
version = "0.1.1"
edition = "2024"
description = "GnuPG pinentry that asks through an Omarchy shell (Quickshell) dialog styled like the polkit agent"
license = "MIT"
authors = ["Laércio de Sousa <laercio@sivali.sousa.nom.br>"]
publish = false

[dependencies]
nix = { version = "0.31", features = ["mman", "process", "socket", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.9", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
panic = "abort"
